[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -p no:cacheprovider
filterwarnings =
    # Mangum() calls asyncio.get_event_loop() at construction; harmless here.
    ignore:There is no current event loop:DeprecationWarning:mangum
